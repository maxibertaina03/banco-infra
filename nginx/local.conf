# nginx para la prueba local (docker-compose.local.yml). Mismo reparto que en
# producción pero sin TLS, para poder verificar los contenedores sin dominio ni
# certificados.

server {
  listen 80;
  server_name localhost;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_read_timeout 60s;

  resolver 127.0.0.11 valid=30s ipv6=off;

  set $portal http://frontend:80;
  set $api    http://backend:3001;

  location /api/      { proxy_pass $api; }
  location /auth/     { proxy_pass $api; }
  location /webhooks/ { proxy_pass $api; }
  location /          { proxy_pass $portal; }
}
