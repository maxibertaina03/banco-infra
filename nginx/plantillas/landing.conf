# La landing: __DOMINIO__ y www.__DOMINIO__
#
# Plantilla: ver el encabezado de app.conf.
#
# Por ahora sirve el placeholder de landing/. Cuando exista la landing de
# verdad, se reemplaza el contenido de esa carpeta (o se cambia por un
# proxy_pass a un contenedor propio) y nada más de acá cambia.

server {
  listen 443 ssl;
  http2 on;
  server_name www.__DOMINIO__;

  ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Una sola dirección canónica: el www manda al dominio pelado.
  return 301 https://__DOMINIO__$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name __DOMINIO__;

  ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:TLS:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  root /var/www/landing;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }
}
