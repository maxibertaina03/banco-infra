# La landing: __DOMINIO__ y www.__DOMINIO__
#
# Plantilla: ver el encabezado de app.conf.
#
# La landing es una app React compilada, que vive en el repo banco-landing y
# corre en su propio contenedor con nginx adentro. Acá sólo se decide que el
# dominio raíz va para allá.

server {
  listen 443 ssl;
  http2 on;
  server_name www.__DOMINIO__;

  ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Una sola dirección canónica: el www manda al dominio pelado.
  return 301 https://__DOMINIO__$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name __DOMINIO__;

  ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:TLS:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  # En variable para que nginx vuelva a resolver el nombre si el contenedor se
  # reinicia y cambia de IP (ver 10-comun.conf).
  set $landing http://landing:80;

  location / {
    proxy_pass $landing;
  }
}
