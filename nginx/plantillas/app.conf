# El portal: __DOMINIO_APP__
#
# Plantilla. `scripts/certificados.sh` reemplaza __DOMINIO__ y __DOMINIO_APP__ y
# deja el resultado en nginx/https.d/. No editar la copia generada: se pisa.

server {
  listen 443 ssl;
  http2 on;
  server_name __DOMINIO_APP__;

  ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:TLS:10m;
  ssl_session_timeout 1d;

  # Un año de HTTPS obligatorio para este host. Sin `includeSubDomains` a
  # propósito: no queremos comprometer subdominios que todavía no existen.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Los destinos van en variables para que nginx vuelva a resolverlos cuando un
  # contenedor se reinicia (ver 10-comun.conf).
  set $portal  http://frontend:80;
  set $api     http://backend:3001;

  # ── API del banco ───────────────────────────────────────────────────────────
  # Mismo origen que el portal: el navegador no hace ni un preflight de CORS.
  location /api/ {
    proxy_pass $api;
  }

  # Perfil del usuario autenticado. El frontend lo llama con ruta absoluta
  # (requestAbsolute en lib/api/client.ts), así que tiene que estar acá.
  location /auth/ {
    proxy_pass $api;
  }

  # Webhook de Clerk: lo llama Clerk desde internet, no el portal. El backend
  # verifica la firma, así que no hace falta restringir por IP.
  location /webhooks/ {
    proxy_pass $api;
  }

  # ── Portal ──────────────────────────────────────────────────────────────────
  location / {
    proxy_pass $portal;
  }
}
