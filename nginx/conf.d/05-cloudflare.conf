# La IP real del cliente cuando Cloudflare está adelante.
#
# Sin esto, nginx ve la IP del borde de Cloudflare y se la pasa al backend como
# si fuera la del cliente. Consecuencia: el rate limit le cuenta las requests de
# medio país a una sola IP, y la auditoría guarda la de Cloudflare en vez de la
# de quien operó.
#
# Cloudflare manda la IP verdadera en el header CF-Connecting-IP, pero sólo se
# le puede creer si la conexión viene de sus rangos: por eso la lista de abajo.
# Si llega un CF-Connecting-IP desde cualquier otro lado, se ignora.
#
# Los rangos los publica Cloudflare en https://www.cloudflare.com/ips-v4 y
# cambian muy de vez en cuando. Para actualizarlos:
#   curl -s https://www.cloudflare.com/ips-v4
#
# Si algún día se saca Cloudflare, este archivo se puede borrar sin más: sin
# tráfico desde esos rangos, no hace nada.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
# Con `real_ip_recursive off` se toma el valor del header tal cual, que es lo
# correcto acá: Cloudflare lo reescribe él mismo en cada request.
real_ip_recursive off;
