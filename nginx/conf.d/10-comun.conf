# Ajustes que valen para todos los server blocks. Al estar en el contexto http,
# los hereda cualquier `location` sin repetirlos.

server_tokens off;

# ── Headers que el backend necesita para saber quién llamó ────────────────────
# Sin estos, Express ve siempre la IP de nginx: el rate limit contaría a todos
# los usuarios como uno solo y la auditoría guardaría la IP interna de Docker.
# Del otro lado, app.js hace `app.set('trust proxy', 1)` para creerles.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
# 60s es holgado a propósito: pagar un servicio o transferir implica esperar al
# Banco Central o al proveedor, que a veces tardan.
proxy_read_timeout    60s;

# Acá no se suben archivos. Cualquier cuerpo más grande que esto es un error o
# alguien probando suerte.
client_max_body_size 1m;

# ── DNS interno de Docker ─────────────────────────────────────────────────────
# Cuando un contenedor se reinicia puede cambiar de IP. Si nginx resolviera los
# nombres una sola vez al arrancar, se quedaría hablándole a una IP que ya no
# existe y todo daría 502 hasta reiniciarlo a mano. Con el resolver y los
# destinos en variables, los vuelve a resolver cada 30 segundos.
resolver 127.0.0.11 valid=30s ipv6=off;
