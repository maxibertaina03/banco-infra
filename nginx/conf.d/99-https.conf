# Los server blocks de HTTPS se activan recién cuando existen los certificados.
#
# `scripts/certificados.sh` toma las plantillas de nginx/plantillas/, les pone
# el dominio y las escribe en nginx/https.d/. Hasta entonces esta carpeta está
# vacía y el comodín no matchea nada, que para nginx es perfectamente válido:
# arranca igual y sirve sólo HTTP, que es justo lo que hace falta para emitir
# los certificados.
include /etc/nginx/https.d/*.conf;
