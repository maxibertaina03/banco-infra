# Puerto 80. Dos trabajos, nada más.
#
# Este archivo está desde el minuto cero, antes de que exista ningún
# certificado: es el que le permite a Let's Encrypt comprobar que el dominio es
# tuyo. Por eso no menciona ningún .pem, que si no nginx no arrancaría.

server {
  listen 80 default_server;
  server_name _;

  # 1) El desafío de Let's Encrypt. certbot deja acá un archivo con un token y
  # Let's Encrypt lo viene a leer por HTTP. Tiene que ir ANTES del redirect.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 2) Todo lo demás se va a HTTPS. Un banco no se sirve por HTTP.
  location / {
    return 301 https://$host$request_uri;
  }
}
